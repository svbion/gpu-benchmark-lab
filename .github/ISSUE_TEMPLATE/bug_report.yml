name: Bug Report
description: Report a public documentation or repository defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a defect. Do not include secrets, private URLs, customer data, or proprietary GPUValidator implementation details.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Link to the file/section and describe the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: public-safety
    attributes:
      label: Public-safety check
      description: Confirm the report avoids sensitive or proprietary information.
      placeholder: This report contains no secrets, private URLs, customer data, or proprietary implementation details.
    validations:
      required: true
