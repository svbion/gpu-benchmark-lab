name: Benchmark Package Validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/validate_benchmark_packages.py
      - run: python3 scripts/validate_docs.py
      - run: python3 scripts/validate_pages.py
