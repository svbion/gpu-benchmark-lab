name: Mermaid validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Render Mermaid diagrams
        run: python3 scripts/validate_mermaid.py
